# Configuración de Samantha (Android).
#
# Este archivo se copia en el primer arranque a:
#   Android/data/com.cdcb.samanthapp/files/config.yaml
# Edita ESA copia (o esta, antes de compilar) y reinicia la app.
#
# reasoning_effort: low | medium | high | xhigh | max  (según el modelo)
# Con "high" responde con más calma y razonamiento; con "low" es más rápida.

ai:
  base_url: "https://opencode.ai/inference/go/openai/v1"
  model: "claude-haiku-5-5"
  reasoning_effort: "high"
  max_tokens: 800
  temperature: 0.6
